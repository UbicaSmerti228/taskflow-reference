# Prometheus сам ходит к сервисам за метриками (pull-модель): раз в scrape_interval
# запрашивает /metrics на служебном порту каждого.
global:
  scrape_interval: 5s # для учебного стенда; в бою обычно 15–60 секунд

scrape_configs:
  - job_name: taskflow
    static_configs:
      - targets: ["api:8081"]
  - job_name: notifier
    static_configs:
      - targets: ["notifier:9001"]
